name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Ruff is a development tool, so it lives in the pyproject dependency
      # group rather than in requirements.txt. No runtime deps needed to lint.
      - name: Install Ruff
        run: pip install --group dev

      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Test suite
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # hidapi and Pillow fall back to an sdist build when no wheel matches the
      # interpreter. These are the Dockerfile build stage's packages.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev pkg-config \
            libusb-1.0-0-dev libudev-dev libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # test_ps3lint.py boots the simulated server and runs tools/ps3lint.py
      # against it, so the markup and CSS 2.1 rules are covered here as well.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  no-hidapi:
    name: Suite runs without hidapi
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Nothing above discstakka/transport.py may touch hidapi. If this job
      # starts failing, the hardware dependency has leaked back into the
      # catalogue, the flows or the web layer.
      - name: Install everything except hidapi
        run: |
          python -m pip install --upgrade pip
          grep -iv '^hidapi' requirements.txt > requirements-nohid.txt
          pip install -r requirements-nohid.txt

      - name: Assert hidapi really is absent
        run: |
          if python -c "import hid" 2>/dev/null; then
            echo "hidapi is installed; this job would prove nothing." >&2
            exit 1
          fi

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

  container:
    name: Container image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The build asserts that `hid` is still the libusb backend. See the
      # comment above that check in the Dockerfile for why it matters, and why
      # it looks at symbols rather than the library filename.
      - name: Build image
        run: docker build -t discstakka-web:ci .

      # Importing the app inside the image proves every module and schema.sql
      # actually shipped. Only possible because create_app() removed app.py's
      # import-time side effects: the import opens no device and writes nothing.
      - name: Smoke-test the image
        run: >
          docker run --rm --entrypoint python discstakka-web:ci
          -c "import app, discstakka.config, discstakka.catalog.db, discstakka.flows,
          discstakka.simulator"

      # No further run step: docker-entrypoint.sh's preflight needs the device
      # nodes and the cgroup rule that docker-compose.yml provisions, and no CI
      # runner has a carousel attached.
