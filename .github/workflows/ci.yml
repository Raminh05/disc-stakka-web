name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Ruff is a development tool, so it lives in the pyproject dependency
      # group. No runtime dependencies are needed to lint.
      - name: Install Ruff
        run: uv sync --frozen --only-group dev

      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

      # uv.lock must match pyproject.toml, and requirements.txt must match the
      # lock. Without these two the lock silently becomes decoration and the
      # container installs something nobody resolved.
      - name: Lock is current
        run: uv lock --check

      # Exported over itself and compared with git: uv writes the invoking
      # command into the header, so exporting to any other path always differs.
      - name: requirements.txt matches the lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project \
            --format requirements-txt -o requirements.txt
          git diff --exit-code -- requirements.txt \
            || { echo "::error::requirements.txt is stale; re-run uv export"; exit 1; }

  tests:
    name: Test suite
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # hidapi and Pillow fall back to an sdist build when no wheel matches the
      # interpreter. These are the Dockerfile build stage's packages.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev pkg-config \
            libusb-1.0-0-dev libudev-dev libjpeg-dev zlib1g-dev

      - name: Install Python dependencies
        run: uv sync --frozen

      # test_ps3lint.py boots the simulated server and runs tools/ps3lint.py
      # against it, so the markup and CSS 2.1 rules are covered here as well.
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -t . -v

  no-hidapi:
    name: Suite runs without hidapi
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Nothing above discstakka/transport.py may touch hidapi. If this job
      # starts failing, the hardware dependency has leaked back into the
      # catalogue, the flows or the web layer.
      - name: Install everything except hidapi
        run: |
          uv venv
          grep -iv '^hidapi' requirements.txt > requirements-nohid.txt
          uv pip install -r requirements-nohid.txt

      - name: Assert hidapi really is absent
        run: |
          if python -c "import hid" 2>/dev/null; then
            echo "hidapi is installed; this job would prove nothing." >&2
            exit 1
          fi

      # Not `uv run`: this environment is deliberately not the project's, so
      # call its interpreter directly rather than let uv reconcile it.
      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -t . -v

  nix:
    name: Nix dev shell
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v23

      # --all-systems because evaluation is the point: a system in the list that
      # nixpkgs no longer supports fails here rather than on someone's machine.
      # That is how the stale x86_64-darwin entry was found. --no-build because
      # a Linux runner cannot build the darwin shell and does not need to.
      - name: Flake evaluates for every declared system
        run: nix flake check --all-systems --no-build

      # The shell existing is not the same as it working. This is the
      # documented workflow: toolchain from nix, packages from uv.lock.
      - name: The shell runs the suite
        run: |
          nix develop --command sh -c '
            uv sync --frozen
            uv run --frozen python -m unittest discover -s tests -t .
          '

  container:
    name: Container image
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The build asserts that `hid` is still the libusb backend. See the
      # comment above that check in the Dockerfile for why it matters, and why
      # it looks at symbols rather than the library filename.
      - name: Build image
        run: docker build -t discstakka-web:ci .

      # Importing the app inside the image proves every module and schema.sql
      # actually shipped. Only possible because create_app() removed app.py's
      # import-time side effects: the import opens no device and writes nothing.
      - name: Smoke-test the image
        run: >
          docker run --rm --entrypoint python discstakka-web:ci
          -c "import app, discstakka.config, discstakka.catalog.db, discstakka.flows,
          discstakka.simulator"

      # No further run step: docker-entrypoint.sh's preflight needs the device
      # nodes and the cgroup rule that docker-compose.yml provisions, and no CI
      # runner has a carousel attached.
