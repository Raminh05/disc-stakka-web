[project]
name = "discstakka-web"
version = "0.1.0"
description = "Web catalogue for the Imation Disc Stakka USB CD carousel"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.14"

# Pinned rather than ranged. uv.lock makes any resolution reproducible, but the
# container build also asserts that hidapi's `hid` is still the libusb backend,
# and that is a thing to change on purpose and then watch, not to drift into.
dependencies = [
    "Flask==3.1.3",
    "Pillow==12.3.0",
    "requests==2.34.2",
    "hidapi==0.15.0",
]

[tool.uv]
# An appliance, not a distributable. app.py sits at the root next to templates/
# and static/ because that is where Flask looks for them, so there is nothing
# here to build a wheel from and nothing to install. uv manages the environment
# and the lock; it does not package the project.
package = false

[dependency-groups]
dev = ["ruff==0.16.8"]

[tool.ruff]
line-length = 88

# Not py314, which requires-python would otherwise infer. Ruff 0.16.8's
# formatter rewrites `except (TypeError, ValueError):` into the Python 2 form
# `except TypeError, ValueError:` when it targets 3.14 - a SyntaxError, in
# app.py and tests/test_ps3lint.py. py313 formats both correctly. Retry py314
# on the next Ruff release; the check is `ruff format --check .`.
target-version = "py313"
extend-exclude = [".venv", ".venv-py39", "data"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear.
#
# UP (pyupgrade) is deliberately absent and should stay absent. It would rewrite
# 94 %-format strings into f-strings and strip `(object)` from six class
# declarations, both of which AGENTS.md requires: this code is read next to a
# 2005 C++ reference and a PS3 browser, and the house style is part of that.
select = ["E", "W", "F", "I", "B"]

[tool.ruff.format]
# Single quotes are not the house style, but neither is reformatting 3500 lines
# to prove it. Only the quote convention is pinned; the rest is Ruff's default.
quote-style = "double"
